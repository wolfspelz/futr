<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#1b8886" opacity=".45"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#e6a92f"/>
      <stop offset="1" stop-color="#2b1b3d"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#glow)"/>
  <rect width="400" height="600" fill="url(#dots)"/>
  <g transform="translate(200 250)">
    <circle r="95" fill="#d8432a" stroke="#231a17" stroke-width="6"/>
    <circle r="60" fill="#f1e3c3" stroke="#231a17" stroke-width="4"/>
    <ellipse rx="150" ry="28" fill="none" stroke="#f1e3c3" stroke-width="7" transform="rotate(-20)"/>
    <ellipse rx="150" ry="28" fill="none" stroke="#231a17" stroke-width="2" transform="rotate(-20)"/>
  </g>
  <rect x="30" y="440" width="340" height="110" fill="#f1e3c3" stroke="#231a17" stroke-width="5" transform="rotate(-2 200 495)"/>
  <text x="200" y="486" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" fill="#231a17" transform="rotate(-2 200 495)">COVER ART</text>
  <text x="200" y="528" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="26" fill="#d8432a" transform="rotate(-2 200 495)">UNAVAILABLE</text>

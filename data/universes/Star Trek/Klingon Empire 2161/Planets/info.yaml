readme: |
  Memory Alpha lists 23 confirmed Klingon worlds across all eras. Not all
  were held by 2161. Known 22nd-century worlds include Qo'noS (homeworld),
  Boreth, Rura Penthe, N'Vak Colony, Qu'Vat Colony, Krios Prime, and Ty'Gokor.

  The Empire is already a major interstellar power with centuries of
  colonization behind it. 20 inhabited worlds is a conservative mid-range
  estimate for this era.

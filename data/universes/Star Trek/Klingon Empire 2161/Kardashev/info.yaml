readme: |
  Population: 9e9. Estimated per-person power: ~100,000 W/person.
  Military-industrial spacefaring civilization with warp ships, disruptor
  manufacturing, planetary industry. About 45x Earth 2023 (2,200 W/person).

  Total power: 9e9 x 1e5 = 9e14 W (900 TW).
  Kardashev: log10(9e14) / 10 - 0.6 = 14.95/10 - 0.6 = 0.895, rounded to 0.9.

  Comparable to Andorian Empire 2161 (K=0.9, similar tech era).
  Earth 2023 baseline: K=0.73. Federation 2373: K=1.0.

  Note: some sources classify the 24th-century Klingon Empire as Type II,
  but that reflects a much later era with far more territory and energy usage.

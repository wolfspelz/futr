readme: |
  Star Trek Star Charts (2002) places Klingon warp capability at approximately
  930 AD (Earth calendar). This makes them one of the older warp-capable
  civilizations in the region, predating humans by over 1,100 years
  (Earth achieved warp in 2063) but postdating the Vulcans (~320 AD)
  and the Andorians (~1154 AD).

readme: |
  No canon population figure exists for the 22nd century Klingon Empire.
  Qo'noS has 3.84 billion inhabitants in 2378 (canon). In 2161, the homeworld
  population is likely similar or slightly lower, around 3-4 billion.

  With roughly 20 colony worlds averaging 250 million each, total Empire
  population is estimated at 9 billion. Range reflects uncertainty: the low
  end assumes fewer, smaller colonies; the high end assumes more established
  worlds with larger populations.

readme: |
  The Chancellor heads the Klingon High Council, which consists of
  representatives from the twenty-four Great Houses. The position of
  Emperor is vacant since the mid-21st century. Chancellor M'Rek holds
  office circa 2154. Each Great House controls its own territory,
  military forces, and economic resources. Succession is decided through
  the Rite of Succession or by combat challenge.

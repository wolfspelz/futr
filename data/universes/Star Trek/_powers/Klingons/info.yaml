readme: |
  The Klingons are a warrior species from the planet Qo'noS in the Beta Quadrant. Their civilization traces its origins to the legendary Kahless the Unforgettable, who unites the Klingon homeworld in the 9th century by defeating the tyrant Molor with the first bat'leth, a curved double-bladed sword forged in the Kri'stak volcano.

  Klingon society is built on honor, combat, and loyalty to one's House. Twenty-four Great Houses control territory, military forces, and resources, and their leaders sit on the Klingon High Council. The Chancellor is head of state, though the position of Emperor exists in certain eras. Succession happens through the Rite of Succession or by ritual combat.

  The Klingon Defense Force fields warships ranging from the nimble Bird-of-Prey to heavy battle cruisers. Every warrior aspires to die in battle, since an honorable death grants passage to Sto-vo-kor, the afterlife for the valiant. A dishonorable death condemns the warrior to Gre'thor instead.

  Klingon culture prizes martial virtue above all else. Their opera celebrates conquest, their cuisine favors live serpent worms and blood wine, and personal honor governs daily life as strictly as it governs war. They have a reputation as ruthless conquerors, but the Klingon code of honor is anything but simple.

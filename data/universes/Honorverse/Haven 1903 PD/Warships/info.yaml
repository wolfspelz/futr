readme: |
  People's Navy fleet composition prior to the First Havenite-Manticoran War:

  | Ship Class        | Units | Tonnage (MT) |
  |-------------------|-------|-------------|
  | Superdreadnoughts | 412   | 2,801.6     |
  | Dreadnoughts      | 48    | 258.3       |
  | Battleships       | 374   | 1,430.6     |
  | Battlecruisers    | 81    | 59.0        |
  | Heavy Cruisers    | 210   | 54.5        |
  | Light Cruisers    | 354   | 29.8        |
  | Destroyers        | 627   | 40.7        |
  | **Total**         | 2,106 | 4,674.5     |

  Second largest navy in human space, behind only the Solarian League Navy. The PN has a 2:1 tonnage advantage over the RMN (4,674.5 vs 2,318.6 MT) and a 1.3:1 numerical advantage (2,106 vs 1,621 ships). The 412 superdreadnoughts form the core striking power. The 374 battleships are a distinctive feature, maintained as rear-area defensive units in a role most navies consider obsolescent.

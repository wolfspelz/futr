readme: |
  The People's Republic of Haven in 1903 PD controls approximately 200 star systems and fields the second largest navy in human-settled space, yet the economic foundations that sustain this vast domain are crumbling. Hereditary President Sidney Harris presides over a state that has not balanced its books in nearly a century.

  # The BLS Crisis

  Secretary of Economy Walter Frankel leaks that the government considers freezing BLS purchasing power, a decision that could trigger mass unrest among the roughly 130 billion Dolists who depend on the stipend. The Legislaturalist inner circle scrambles to contain the political fallout while searching for new conquests to fund the ever-growing welfare burden.

  # Operation Jericho

  Haven enters a covert alliance with the Masadan theocracy to seize the Grayson System, seeking to deny Manticore a potential ally while securing another strategic position. The operation ends in failure when Captain Honor Harrington's task force defeats the combined Masadan-Havenite forces at the Second Battle of Yeltsin's Star. Commander Thomas Theisman, one of Haven's most capable young officers, is caught in the debacle.

  # On the Brink of War

  The war with Manticore everyone expects draws closer. Fleet Admiral Amos Parnell estimates the Royal Manticoran Navy holds a twenty to thirty percent qualitative advantage, a gap he believes the People's Navy's numerical superiority can overcome. He underestimates it. Within two years, Harris will be assassinated and the Committee of Public Safety will seize power.

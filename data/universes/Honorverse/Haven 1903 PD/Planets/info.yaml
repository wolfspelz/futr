readme: |
  The Honorverse Wiki references 75+ inhabited worlds for the later war period. At 1903 PD the number is similar or slightly lower after five decades of conquest under the DuQuesne Plan. Several major systems (Haven, MacGregor, Trevor's Star) have multiple inhabited worlds, pushing the total above the number of inhabited star systems.

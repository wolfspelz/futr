readme: |
  Formally a people's republic with a President and legislature. In practice, an authoritarian oligarchy run by Legislaturalist families since the mid-18th century PD. The Hereditary President holds office for life. Sidney Harris has held the presidency since before 1867 PD. The Constitution is a facade.

  Key officials in 1903 PD: Secretary for Foreign Affairs Ronald Bergren, Secretary of War Elaine Dumarest, Secretary of Economy Walter Frankel. The Presidential Security Force (mercenaries from New Geneva) provides personal security for the President. Fleet Admiral Amos Parnell serves as Chief of Naval Operations.

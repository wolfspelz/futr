readme: |
  TL 9 FTL. Same fundamental tech base as Manticore: hyperspace FTL, impeller wedge drives, fusion power, gravitics. One generation behind in electronics, EW, missile guidance, and compensator efficiency. Lacks grav-pulse FTL communications (relies on courier boats). Hardest tech is still the impeller wedge, which Haven fields at comparable scale. The quality gap is in refinement and implementation, not in fundamental capability.

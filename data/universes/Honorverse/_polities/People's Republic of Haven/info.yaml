readme: |
  The People's Republic of Haven is one of the largest and most powerful star nations in human-settled space. Founded in 1309 PD when colonists first arrive in the Haven System, 667 light-years from Sol, the Republic grows over centuries from a stable representative democracy into a sprawling authoritarian welfare state.

  # The Legislaturalists

  By the 18th century PD, Haven's Economic Bill of Rights creates a universal welfare system that evolves into the Basic Living Stipend. As the BLS grows, so does the Dolist class: unemployed citizens who trade their votes for government support. Real power concentrates in the hands of Legislaturalist families, hereditary political dynasties who maintain a facade of republican government while ruling through the office of Hereditary President.

  # The DuQuesne Plan

  With the treasury emptied by 1804 PD and inflation spiraling, the Legislaturalists adopt the DuQuesne Plan: systematic military conquest of neighboring star systems to sustain the domestic economy. Over decades, the People's Navy absorbs nearly a hundred independent systems. Each conquest temporarily shores up the BLS, but the costs of occupation and the integration of new Dolist populations create a vicious cycle demanding further expansion.

  # The People's Navy

  The Republic maintains the second largest navy in human space, fielding thousands of warships across hundreds of star systems. The People's Navy compensates for a persistent technology gap with Manticore through sheer industrial scale and numerical superiority.
